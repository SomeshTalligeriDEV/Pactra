# The demo seller, on its own name.
#
# A paid endpoint that is not the record, so a demo buys from a seller other
# than Pactra. Proxied exactly like attest, and for the same reason: the
# process holds a relayer key and binds 127.0.0.1.
#
# It shares the `pactra_attest` rate-limit zone from conf.d. The zone is keyed
# by client address, so sharing it costs a client nothing it would not already
# be limited to, and a second zone would be a second thing to declare once.

server {
    listen 80;
    listen [::]:80;
    server_name demo-seller.pactra.example;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pactra;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo-seller.pactra.example;

    ssl_certificate     /etc/letsencrypt/live/demo-seller.pactra.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-seller.pactra.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/pactra-demo-seller.access.log;
    error_log  /var/log/nginx/pactra-demo-seller.error.log;

    client_max_body_size 16k;

    location / {
        limit_req zone=pactra_attest burst=20 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/pactra-headers.conf;
        proxy_pass http://127.0.0.1:8406;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Collection is a transaction on Arc; a shorter timeout returns 504 to
        # a payer whose authorisation was spent.
        proxy_read_timeout 120s;

        proxy_pass_request_headers on;
        proxy_set_header X-PAYMENT $http_x_payment;
    }
}
