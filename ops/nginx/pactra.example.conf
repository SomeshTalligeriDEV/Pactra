# Pactra on pactra.example. The site, the console and the meter's read API
# behind one origin.
#
# One origin is not a convenience here. The console asks the owner's wallet to
# sign typed data whose domain names the contract; serving the console from one
# host while its API answers on another buys a CORS problem and nothing else.
# The site is also the thing the chain points at: ConductRecord writes
# https://pactra.example/refusal/<id> into every record and the daemon writes
# https://pactra.example/agent/<id>, so those paths belong to the origin the
# record names, not to a subdomain nobody wrote down.
#
# attest is the exception and it has its own file. It cannot live here because
# the site already owns /attest/:id as a page, and because it is the one
# surface that takes money.

server {
    listen 80;
    listen [::]:80;
    server_name pactra.example www.pactra.example;

    # Left open for the renewal. The challenge is a file under the same root,
    # and a blanket redirect on this path is how an automatic renewal quietly
    # stops working three months from now.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pactra;
        default_type "text/plain";
    }

    location / { return 301 https://pactra.example$request_uri; }
}

server {
    # `http2 on;` is nginx 1.25.1 and later. This box runs 1.24, where the
    # switch is still part of the listen directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pactra.example;

    ssl_certificate     /etc/letsencrypt/live/pactra.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pactra.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical name. The URIs in the contract have no www, so the www
    # host exists only to send a visitor to the name the record uses.
    #
    # The headers go on the redirect too. It is the first response a visitor
    # who typed the www name gets, and `always` is what makes add_header apply
    # to a 3xx at all. The bare name's HSTS covers this host through
    # includeSubDomains either way; this is so the covering header is not the
    # second response rather than the first.
    include /etc/nginx/snippets/pactra-headers.conf;
    return 301 https://pactra.example$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pactra.example;

    ssl_certificate     /etc/letsencrypt/live/pactra.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pactra.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pactra;
    index index.html;

    include /etc/nginx/snippets/pactra-compression.conf;

    access_log /var/log/nginx/pactra.access.log;
    error_log  /var/log/nginx/pactra.error.log;

    include /etc/nginx/snippets/pactra-locations.conf;
}
