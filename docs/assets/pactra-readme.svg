<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Pactra — One budget. Every agent.</title><desc id="desc">A shared root budget connects an orchestrator, workers and helpers. Each draw counts against the root.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#21131d"/><stop offset="1" stop-color="#08090d"/></linearGradient><linearGradient id="brand" x2="1" y2="1"><stop stop-color="#e18da5"/><stop offset="1" stop-color="#ad314d"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".065"/></pattern></defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/><rect width="1280" height="420" rx="24" fill="url(#dots)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="60" y="48" width="44" height="44" rx="13" fill="url(#brand)"/><g fill="white"><circle cx="75" cy="63" r="3"/><circle cx="89" cy="63" r="3" opacity=".6"/><circle cx="75" cy="77" r="3" opacity=".6"/><circle cx="89" cy="77" r="3"/></g>
<text x="119" y="80" fill="white" font-size="31" font-weight="600" letter-spacing="-1">Pactra</text><text x="61" y="165" fill="#e0a0b3" font-size="12" letter-spacing="3">DELEGATE THE WORK. KEEP THE BOUND.</text>
<text x="58" y="232" fill="white" font-size="57" font-weight="600" letter-spacing="-2">One budget.</text><text x="58" y="296" fill="white" font-size="57" font-weight="600" letter-spacing="-2">Every agent.</text><text x="61" y="352" fill="#b5acb6" font-size="16">Shared limits, enforced on chain.</text>
<g fill="none" stroke="#a25470" stroke-width="2"><path d="M949 128V155H817V203M949 155H1081V203"/><path d="M817 242V268H753V309M817 268H881V309M1081 242V268H1017V309M1081 268H1145V309"/></g>
<rect x="850" y="66" width="198" height="62" rx="16" fill="url(#brand)"/><text x="949" y="92" text-anchor="middle" fill="white" font-size="12" letter-spacing="1.5">SHARED ROOT</text><text x="949" y="115" text-anchor="middle" fill="white" font-size="17" font-weight="600">One signed budget</text>
<g fill="#30202d" stroke="#956079"><rect x="765" y="199" width="104" height="43" rx="12"/><rect x="1029" y="199" width="104" height="43" rx="12"/></g><g fill="#f7e7ee" font-size="14" text-anchor="middle"><text x="817" y="225">Worker A</text><text x="1081" y="225">Worker B</text></g>
<g fill="#1d1923" stroke="#765063"><circle cx="753" cy="322" r="17"/><circle cx="881" cy="322" r="17"/><circle cx="1017" cy="322" r="17"/><circle cx="1145" cy="322" r="17"/></g><g fill="#e2a5b8"><circle cx="753" cy="322" r="4"/><circle cx="881" cy="322" r="4"/><circle cx="1017" cy="322" r="4"/><circle cx="1145" cy="322" r="4"/></g><text x="949" y="374" fill="#b5acb6" text-anchor="middle" font-size="13">Every draw debits every ancestor.</text></g></svg>
